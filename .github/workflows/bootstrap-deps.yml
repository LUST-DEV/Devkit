name: Bootstrap dependencies (one-time)

on:
  workflow_dispatch:
  push:
    branches: [chore/scaffold]
    paths: [.github/workflows/bootstrap-deps.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Pin TypeScript to a version supported by typescript-eslint
        run: pnpm add -D typescript@6
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: pin typescript to 6.x"
          git push
