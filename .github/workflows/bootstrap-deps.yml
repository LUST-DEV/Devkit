name: Bootstrap dependencies (temporary)

on:
  workflow_dispatch:
  push:
    branches: [feat/app-shell]
    paths: [.github/workflows/bootstrap-deps.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm add react-router lucide-react
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: add react-router and lucide-react"
          git push
