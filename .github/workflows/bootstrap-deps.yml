name: Bootstrap dependencies (one-time)

on:
  workflow_dispatch:
  push:
    branches: [chore/scaffold]
    paths: [.github/workflows/bootstrap-deps.yml]

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm add react react-dom
      - run: >-
          pnpm add -D
          typescript vite @vitejs/plugin-react
          tailwindcss @tailwindcss/vite
          vitest jsdom
          @testing-library/react @testing-library/jest-dom
          @types/react @types/react-dom
          eslint @eslint/js typescript-eslint eslint-plugin-react-hooks globals
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: resolve dependencies and add lockfile"
          git push
      - name: Trigger CI on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
